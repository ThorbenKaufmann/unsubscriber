# unsubscriber settings - copy to ~/.config/unsubscriber/config.ini
# All entries are optional.

[unsubscriber]
# Name your provider writes at the start of Authentication-Results.
# Only results from this server are trusted.
#authserv_id = mail.example.com

# notmuch config to use instead of notmuch's default.
#notmuch_config = ~/.notmuch-config

# Further notmuch configs (comma separated) in which blocked senders are
# tagged as spam as well, e.g. an old archive.
#extra_configs = ~/.notmuch-config-old

# Tags applied to existing mail of blocked senders.
#spam_tags = +spam -inbox

# Needed for mailto: unsubscribes. The mail is always sent from the address
# that received the newsletter; {sender} is replaced by it.
[smtp]
host = smtp.example.com
port = 465
user = {sender}
passcmd = pass show mail/{sender}

# Alternative to host/port/user/passcmd: hand the mail to a local MTA that
# relays through your provider. (Sending directly from a home connection
# fails SPF/DMARC.) Sender (-f) and recipient are appended by unsubscriber.
#sendmail = /usr/sbin/sendmail -oi

# Needed for purge: moves mail of blocked and unsubscribed senders to the
# trash on the server. Every account logs in with its own address.
[imap]
host = imap.example.com
port = 993
user = {sender}
passcmd = pass show mail/{sender}

# Accounts to clean (default: all addresses from the notmuch config).
#accounts = me@example.com, other@example.com

# Folders to clean (default: INBOX).
#folders = INBOX

# Used only if the server does not mark its trash folder (RFC 6154).
#trash = Trash
